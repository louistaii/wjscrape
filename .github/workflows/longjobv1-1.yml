name: Lazada Stock Checker (Long Job v1-1)
on:
  repository_dispatch:
    types: [run-longjobv1-1]
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install playwright requests seleniumbase

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Install SeleniumBase's chromedriver
        run: |
          seleniumbase install chromedriver

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python longjobv1-1.py